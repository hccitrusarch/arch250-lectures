<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARCH 250 Test Slide</title>

<style>
  body {
    font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    background: #0a0a0f;
    color: #e8e6e3;
    margin: 0;
    padding: 40px 20px;
  }

  .slide {
    max-width: 900px;
    margin: auto;
    background: #14141f;
    border: 1px solid #2a2a3a;
    border-radius: 12px;
    padding: 30px;
  }

  h1 {
    color: #c9a84c;
    margin-bottom: 10px;
  }

  p {
    color: #8a8a9a;
    line-height: 1.6;
  }

  img {
    width: 100%;
    border-radius: 10px;
    margin-top: 20px;
  }

  .audio-block {
    margin-top: 20px;
  }

  audio {
    width: 100%;
  }
</style>
</head>

<body>

<div class="slide">

  <h1>Roman Concrete Revolution</h1>

  <p>
  Roman concrete, or opus caementicium, allowed architects to break free from
  post-and-lintel limitations. It enabled vaults, domes, and massive interior
  spaces that redefined architectural possibility across the empire.
  </p>

  <img src="concrete-test.jpg" alt="Roman concrete vault diagram">

  <div class="audio-block">
    <audio controls>
      <source src="audio-test.mp3" type="audio/mpeg">
    </audio>
  </div>

</div>

</body>
</html>
