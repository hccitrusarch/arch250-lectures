<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARCH 250  -  Architecture History Timeline</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap');

  :root {
    --bg: #0a0a0f;
    --surface: #14141f;
    --surface2: #1e1e2e;
    --border: #2a2a3a;
    --text: #e8e6e3;
    --text-muted: #8a8a9a;
    --accent: #c9a84c;
    --accent-dim: #7a6530;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow-x: hidden;
  }

  /* HEADER */
  header {
    text-align: center;
    padding: 60px 20px 30px;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, #12121a 0%, var(--bg) 100%);
  }
  header h1 {
    font-family: 'Playfair Display', serif;
    font-size: 2.4rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: var(--accent);
  }
  header p {
    font-size: 0.95rem;
    color: var(--text-muted);
    margin-top: 8px;
    font-weight: 300;
  }

  /* ERA NAV */
  #era-nav {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 6px;
    padding: 18px 20px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .era-btn {
    padding: 6px 14px;
    border: 1px solid var(--border);
    border-radius: 20px;
    background: transparent;
    color: var(--text-muted);
    font-size: 0.78rem;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
    transition: all 0.25s;
    white-space: nowrap;
  }
  .era-btn:hover, .era-btn.active {
    background: var(--accent);
    color: #0a0a0f;
    border-color: var(--accent);
    font-weight: 500;
  }

  /* FILTER BAR */
  #filter-bar {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
    padding: 14px 20px;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
  }
  #search-input {
    padding: 8px 16px;
    width: 320px;
    max-width: 60vw;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface);
    color: var(--text);
    font-size: 0.85rem;
    font-family: 'Inter', sans-serif;
    outline: none;
    transition: border-color 0.2s;
  }
  #search-input:focus { border-color: var(--accent); }
  #search-input::placeholder { color: var(--text-muted); }

  #entry-count {
    font-size: 0.78rem;
    color: var(--text-muted);
  }

  /* TIMELINE CONTAINER */
  #timeline {
    max-width: 960px;
    margin: 0 auto;
    padding: 40px 20px 80px;
    position: relative;
  }

  /* Central spine */
  #timeline::before {
    content: '';
    position: absolute;
    left: 50%;
    top: 0;
    bottom: 0;
    width: 2px;
    background: var(--border);
    transform: translateX(-50%);
  }

  /* ERA SECTION */
  .era-section {
    margin-bottom: 60px;
  }
  .era-header {
    text-align: center;
    position: relative;
    z-index: 2;
    margin-bottom: 30px;
  }
  .era-header h2 {
    font-family: 'Playfair Display', serif;
    font-size: 1.5rem;
    color: var(--accent);
    display: inline-block;
    background: var(--bg);
    padding: 8px 24px;
    border: 1px solid var(--accent-dim);
    border-radius: 4px;
  }
  .era-header .era-dates {
    font-size: 0.8rem;
    color: var(--text-muted);
    margin-top: 6px;
    font-weight: 300;
  }
  .era-header .era-week {
    font-size: 0.7rem;
    color: var(--accent);
    margin-top: 4px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  /* ENTRY CARD */
  .entry {
    position: relative;
    width: 44%;
    padding: 18px 22px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 24px;
    cursor: pointer;
    transition: all 0.3s;
  }
  .entry:hover {
    border-color: var(--accent-dim);
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }
  .entry.left { margin-left: 0; margin-right: auto; }
  .entry.right { margin-left: auto; margin-right: 0; }

  /* Connector dot */
  .entry::after {
    content: '';
    position: absolute;
    top: 24px;
    width: 10px;
    height: 10px;
    background: var(--accent);
    border-radius: 50%;
    border: 2px solid var(--bg);
  }
  .entry.left::after { right: -32px; }
  .entry.right::after { left: -32px; }

  /* Connector line */
  .entry::before {
    content: '';
    position: absolute;
    top: 28px;
    width: 24px;
    height: 1px;
    background: var(--border);
  }
  .entry.left::before { right: -24px; }
  .entry.right::before { left: -24px; }

  .entry-date {
    font-size: 0.72rem;
    color: var(--accent);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 6px;
  }
  .entry-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.05rem;
    font-weight: 600;
    margin-bottom: 4px;
    line-height: 1.3;
  }
  .entry-location {
    font-size: 0.75rem;
    color: var(--text-muted);
    margin-bottom: 8px;
    font-style: italic;
  }

  /* ENTRY IMAGE */
  .entry-img-wrap {
    margin: 10px 0 6px;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid var(--border);
    background: #0f0f18;
    display: none;
  }
  .entry-img {
    display: block;
    width: 100%;
    height: auto;
  }
  .entry.has-img .entry-img-wrap { display: block; }
  .entry-summary {
    font-size: 0.82rem;
    color: var(--text-muted);
    line-height: 1.55;
    display: none;
  }
  .entry.expanded .entry-summary { display: block; }

  /* SPATIAL DIAGRAMS (B2) */
  .plan-wrap {
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px solid var(--border);
  }
  .plan-topline {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 8px;
  }
  .plan-label {
    font-size: 0.7rem;
    color: var(--text-muted);
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .plan-toggle {
    appearance: none;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 0.74rem;
    cursor: pointer;
    transition: border-color 0.2s, transform 0.05s;
    white-space: nowrap;
  }
  .plan-toggle:hover { border-color: var(--accent-dim); }
  .plan-toggle:active { transform: translateY(1px); }
  .plan-panel { display: none; }
  .plan-panel.open { display: block; }
  .plan-svg {
    width: 100%;
    max-width: 280px;
    height: auto;
    display: block;
    margin-top: 6px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #0f0f18;
  }
  .plan-logic {
    margin-top: 10px;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface);
  }
  .plan-logic strong {
    color: var(--accent);
    font-size: 0.8rem;
  }
  .plan-logic p {
    margin-top: 6px;
    font-size: 0.8rem;
    color: var(--text-muted);
    line-height: 1.5;
  }

  .entry-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-top: 10px;
  }
  .tag {
    font-size: 0.65rem;
    padding: 2px 8px;
    border-radius: 10px;
    background: var(--surface2);
    color: var(--text-muted);
    border: 1px solid var(--border);
  }

  .expand-hint {
    font-size: 0.7rem;
    color: var(--accent-dim);
    margin-top: 8px;
    transition: color 0.2s;
  }
  .entry:hover .expand-hint { color: var(--accent); }
  .entry.expanded .expand-hint::after { content: 'click to collapse'; }
  .entry:not(.expanded) .expand-hint::after { content: 'click to expand'; }

  /* KEY CONCEPTS PANEL */
  .concepts-panel {
    max-width: 960px;
    margin: 0 auto 40px;
    padding: 0 20px;
    display: none;
  }
  .concepts-panel.visible { display: block; }
  .concepts-panel h3 {
    font-family: 'Playfair Display', serif;
    font-size: 1.1rem;
    color: var(--accent);
    margin-bottom: 14px;
    text-align: center;
  }
  .concepts-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 10px;
  }
  .concept-card {
    padding: 12px 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  .concept-card strong {
    font-size: 0.82rem;
    color: var(--text);
    display: block;
    margin-bottom: 4px;
  }
  .concept-card span {
    font-size: 0.75rem;
    color: var(--text-muted);
    line-height: 1.4;
  }


  /* ERA STUDY PANEL (Expanded Key Terms) */
  .era-study {
    max-width: 960px;
    margin: 18px auto 26px;
    padding: 0 20px;
  }
  .era-study-toggle {
    display: block;
    width: 100%;
    padding: 14px 18px;
    background: var(--surface);
    border: 2px solid var(--accent-dim);
    border-radius: 10px;
    color: var(--accent);
    font-family: 'Inter', sans-serif;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s, border-color 0.2s;
    text-align: left;
  }
  .era-study-toggle:hover {
    border-color: var(--accent);
    background: var(--surface2);
  }
  .era-study-content {
    display: none;
    margin-top: 12px;
    padding: 18px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
  }
  .era-study-content.open { display: block; }

  .concepts-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 12px;
    margin-bottom: 14px;
  }
  .concept-card {
    padding: 12px 14px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  .concept-card strong {
    font-size: 0.82rem;
    color: var(--accent);
    display: block;
    margin-bottom: 6px;
    font-weight: 700;
    letter-spacing: 0.01em;
  }
  .concept-card span {
    font-size: 0.78rem;
    color: var(--text-muted);
    line-height: 1.45;
    display: block;
  }
  .concept-line,
  .concept-examples,
  .concept-check {
    margin-top: 8px;
    font-size: 0.76rem;
    color: var(--text-muted);
    line-height: 1.45;
  }
  .concept-line em,
  .concept-examples em,
  .concept-check em {
    color: var(--accent);
    font-style: normal;
    font-weight: 700;
  }
  .concept-check {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--border);
  }

  .architects-section {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--border);
  }
  .architects-section strong {
    font-size: 0.82rem;
    color: var(--accent);
    display: block;
    margin-bottom: 6px;
  }
  .architects-section p {
    font-size: 0.8rem;
    color: var(--text-muted);
    line-height: 1.5;
  }



  /* ANIMATED BACKGROUND: Nebula + Stars */
  .bg-sky {
    position: fixed;
    inset: 0;
    z-index: -5;
    pointer-events: none;
    overflow: hidden;
    background:
      radial-gradient(1200px 800px at 20% 10%, rgba(201,168,76,0.10), transparent 55%),
      radial-gradient(900px 700px at 80% 20%, rgba(120,110,255,0.10), transparent 60%),
      radial-gradient(1000px 800px at 60% 80%, rgba(255,90,180,0.08), transparent 60%),
      radial-gradient(1400px 1000px at 40% 60%, rgba(40,200,255,0.06), transparent 65%),
      linear-gradient(180deg, #07070c 0%, #0a0a0f 45%, #07070c 100%);
  }

  .bg-sky::before,
  .bg-sky::after {
    content: "";
    position: absolute;
    inset: -50%;
    background-repeat: repeat;
    background-size: 360px 360px;
    opacity: 0.35;
    filter: blur(0px);
    transform: translate3d(0,0,0);
    animation: starDrift 70s linear infinite;
  }

  /* Dense star layer */
  .bg-sky::before {
    background-image:
      radial-gradient(2px 2px at 10px 20px, rgba(255,255,255,0.9) 50%, transparent 55%),
      radial-gradient(1px 1px at 60px 80px, rgba(255,255,255,0.7) 50%, transparent 55%),
      radial-gradient(1.5px 1.5px at 120px 40px, rgba(255,255,255,0.8) 50%, transparent 55%),
      radial-gradient(1px 1px at 200px 140px, rgba(255,255,255,0.6) 50%, transparent 55%),
      radial-gradient(2px 2px at 280px 220px, rgba(255,255,255,0.85) 50%, transparent 55%),
      radial-gradient(1px 1px at 330px 310px, rgba(255,255,255,0.55) 50%, transparent 55%),
      radial-gradient(1.5px 1.5px at 40px 260px, rgba(255,255,255,0.65) 50%, transparent 55%),
      radial-gradient(1px 1px at 170px 300px, rgba(255,255,255,0.5) 50%, transparent 55%),
      radial-gradient(2px 2px at 260px 70px, rgba(255,255,255,0.75) 50%, transparent 55%);
  }

  /* Sparse, larger, twinkling layer */
  .bg-sky::after {
    background-size: 520px 520px;
    opacity: 0.22;
    animation: starDrift 115s linear infinite, starTwinkle 6s ease-in-out infinite;
    background-image:
      radial-gradient(2.2px 2.2px at 50px 120px, rgba(255,255,255,0.75) 50%, transparent 55%),
      radial-gradient(2.8px 2.8px at 260px 260px, rgba(255,255,255,0.85) 50%, transparent 55%),
      radial-gradient(2px 2px at 420px 80px, rgba(255,255,255,0.7) 50%, transparent 55%),
      radial-gradient(3px 3px at 160px 420px, rgba(255,255,255,0.8) 50%, transparent 55%);
  }

  @keyframes starDrift {
    0%   { transform: translate3d(0, 0, 0); }
    100% { transform: translate3d(18%, 12%, 0); }
  }
  @keyframes starTwinkle {
    0%, 100% { opacity: 0.20; }
    50%      { opacity: 0.32; }
  }

  /* Optional subtle constellation lines (very faint) */
  .constellations {
    position: absolute;
    inset: 0;
    opacity: 0.14;
    mix-blend-mode: screen;
    filter: blur(0.2px);
    animation: constellationFloat 40s ease-in-out infinite;
  }
  @keyframes constellationFloat {
    0%, 100% { transform: translate3d(0,0,0) scale(1); }
    50%      { transform: translate3d(-10px, 12px, 0) scale(1.02); }
  }

  /* Respect reduced motion */
  @media (prefers-reduced-motion: reduce) {
    .bg-sky::before,
    .bg-sky::after,
    .constellations {
      animation: none !important;
    }
  }


  /* RESPONSIVE */
  @media (max-width: 700px) {
    #timeline::before { left: 20px; }
    .entry { width: calc(100% - 50px); margin-left: 50px !important; margin-right: 0 !important; }
    .entry::after { left: -38px !important; right: auto !important; }
    .entry::before { left: -30px !important; right: auto !important; }
    .era-btn { font-size: 0.7rem; padding: 5px 10px; }
    header h1 { font-size: 1.6rem; }
  }

  /* SCROLL ANIMATION */
  .entry { opacity: 0; transform: translateY(20px); transition: opacity 0.5s, transform 0.5s, border-color 0.3s, box-shadow 0.3s; }
  .entry.visible { opacity: 1; transform: translateY(0); }
  .entry:hover.visible { transform: translateY(-2px); }

  /* HIDDEN */
  .hidden { display: none !important; }
</style>
</head>

<header>
  <h1>ARCH 250 - History of Architecture</h1>
  <p>Prehistory to Mannerism &middot; Interactive Timeline</p>
</header>

<nav id="era-nav"></nav>

<div id="filter-bar">
  <input type="text" id="search-input" placeholder="Search buildings, architects, concepts&hellip;" />
  <span id="entry-count"></span>
</div>

<div id="timeline"></div>

<script>
const DATA = [
  // =============================================

// Image loading (Wikipedia JSONP, Option A)
// Works when the file is opened locally (file://) because it does
// not use fetch/XHR.
// Strategy:
//  1) Try direct title lookup (with redirects)
//  2) If no thumbnail, run a Wikipedia search (title + location) and use the top hit
// -------------------------------------------------------------

// Some timeline labels are not ideal Wikipedia page titles.
// Add fixes here as needed.
const WIKI_TITLE_OVERRIDES = {
  "White Temple & Ziggurat at Uruk": "White Temple (Uruk)",
  "Megalithic Temples of Malta": "Megalithic Temples of Malta",
  "Hagia Sophia": "Hagia Sophia",
  "Old St. Peter’s Basilica": "Old St. Peter's Basilica",
};

// Normalize punctuation so Wikipedia titles resolve more often
function normalizeWikiTitle(str) {
  return (str || "")
    .replace(/[“”]/g, '"')
    .replace(/[‘’]/g, "'")
    .replace(/\s+/g, " ")
    .trim();
}

function getWikiTitle(entry) {
  return normalizeWikiTitle(entry.wiki || WIKI_TITLE_OVERRIDES[entry.title] || entry.title);
}

function jsonp(url, cbName, onDone) {
  const script = document.createElement('script');
  window[cbName] = (data) => {
    try { onDone(data); }
    finally {
      try { delete window[cbName]; } catch (e) {}
      script.remove();
    }
  };
  script.onerror = () => {
    try { delete window[cbName]; } catch (e) {}
    script.remove();
    onDone(null);
  };
  script.src = url;
  document.head.appendChild(script);
}

function wikiThumbByTitle(title, done) {
  const cbName = `wiki_title_${Math.random().toString(36).slice(2)}`;
  const api = 'https://en.wikipedia.org/w/api.php';
  const params = new URLSearchParams({
    action: 'query',
    format: 'json',
    prop: 'pageimages',
    piprop: 'thumbnail',
    pithumbsize: '700',
    redirects: '1',
    titles: title,
    callback: cbName,
  });
  const url = `${api}?${params.toString()}`;
  jsonp(url, cbName, (data) => {
    try {
      const pages = data && data.query && data.query.pages ? data.query.pages : null;
      const firstKey = pages ? Object.keys(pages)[0] : null;
      const page = firstKey ? pages[firstKey] : null;
      const thumb = page && page.thumbnail && page.thumbnail.source ? page.thumbnail.source : null;
      done(thumb || null);
    } catch (e) {
      done(null);
    }
  });
}

function wikiThumbBySearch(term, done) {
  const cbName = `wiki_search_${Math.random().toString(36).slice(2)}`;
  const api = 'https://en.wikipedia.org/w/api.php';
  // generator=search lets us retrieve a thumbnail in the same response
  const params = new URLSearchParams({
    action: 'query',
    format: 'json',
    generator: 'search',
    gsrsearch: term,
    gsrlimit: '1',
    prop: 'pageimages',
    piprop: 'thumbnail',
    pithumbsize: '700',
    redirects: '1',
    callback: cbName,
  });
  const url = `${api}?${params.toString()}`;
  jsonp(url, cbName, (data) => {
    try {
      const pages = data && data.query && data.query.pages ? data.query.pages : null;
      const key = pages ? Object.keys(pages)[0] : null;
      const page = key ? pages[key] : null;
      const thumb = page && page.thumbnail && page.thumbnail.source ? page.thumbnail.source : null;
      done(thumb || null);
    } catch (e) {
      done(null);
    }
  });
}

function loadWikiThumb(imgEl, entry) {
  const wrap = imgEl.closest('.entry');
  const title = getWikiTitle(entry);

  // 1) Direct title lookup
  wikiThumbByTitle(title, (thumb1) => {
    if (thumb1) {
      imgEl.src = thumb1;
      wrap.classList.add('has-img');
      return;
    }

    // 2) Search fallback (title + location helps a lot)
    const searchTerm = normalizeWikiTitle(`${title} ${entry.location || ""}`.trim());
    wikiThumbBySearch(searchTerm, (thumb2) => {
      if (thumb2) {
        imgEl.src = thumb2;
        wrap.classList.add('has-img');
      }
    });
  });
}

    return svgWrap(inner);
  }

  if (key === "stonehenge") {
    const inner = `
      <circle cx="120" cy="84" r="58" />
      <circle cx="120" cy="84" r="38" stroke-opacity="0.55" />
      <circle cx="120" cy="84" r="18" stroke-opacity="0.35" />
      ${svgLabels(diagram.labels)}
    `;
    return svgWrap(inner);
  }

  if (key === "newgrange") {
    const inner = `
      <circle cx="120" cy="84" r="54" />
      <rect x="36" y="78" width="70" height="12" rx="2" stroke-opacity="0.65" />
      <circle cx="140" cy="84" r="18" stroke-opacity="0.55" />
      <line x1="72" y1="84" x2="122" y2="84" stroke-opacity="0.8" />
      ${svgLabels(diagram.labels)}
    `;
    return svgWrap(inner);
  }

  if (key === "knossos") {
    const inner = `
      <rect x="44" y="40" width="152" height="96" rx="2" stroke-opacity="0.55" />
      <rect x="88" y="66" width="64" height="44" rx="2" />
      <rect x="54" y="50" width="28" height="24" rx="2" stroke-opacity="0.35" />
      <rect x="156" y="50" width="28" height="24" rx="2" stroke-opacity="0.35" />
      <rect x="54" y="102" width="28" height="24" rx="2" stroke-opacity="0.35" />
      <rect x="156" y="102" width="28" height="24" rx="2" stroke-opacity="0.35" />
      ${svgLabels(diagram.labels)}
    `;
    return svgWrap(inner);
  }

  return "";
}

function buildDiagramBlock(entry) {
  const diagram = DIAGRAMS[entry.title];
  if (!diagram) return "";
  const svg = buildSVG(diagram);
  const logic = diagram.logic || "";
  return `
    <div class="plan-wrap">
      <div class="plan-topline">
        <div class="plan-label">Spatial diagram</div>
        <button class="plan-toggle" type="button">Show Spatial Diagram</button>
      </div>
      <div class="plan-panel">
        ${svg}
        <div class="plan-logic">
          <strong>Spatial Logic</strong>
          <p>${escapeHTML(logic)}</p>
        </div>
      </div>
    </div>
  `;
}

// Small helper for safe text injection (used in diagrams)
function escapeHTML(str) {
  return String(str)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll("\"", "&quot;")
    .replaceAll("'", "&#39;");
}


// =============================================
// RENDER ENGINE
// =============================================
const timeline = document.getElementById('timeline');
const eraNav = document.getElementById('era-nav');
const searchInput = document.getElementById('search-input');
const entryCount = document.getElementById('entry-count');

let allEntries = [];
let activeEra = null;

// Build nav and timeline
DATA.forEach((eraData, eraIdx) => {
  // Nav button
  const btn = document.createElement('button');
  btn.className = 'era-btn';
  btn.textContent = eraData.era;
  btn.dataset.era = eraData.era;
  btn.addEventListener('click', () => {
    if (activeEra === eraData.era) {
      activeEra = null;
      btn.classList.remove('active');
    } else {
      activeEra = eraData.era;
      document.querySelectorAll('.era-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }
    filterEntries();
    // Scroll to era
    if (activeEra) {
      const section = document.querySelector(`[data-era-section="${eraData.era}"]`);
      if (section) section.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  });
  eraNav.appendChild(btn);

  // Era section
  const section = document.createElement('div');
  section.className = 'era-section';
  section.dataset.eraSection = eraData.era;

  const header = document.createElement('div');
  header.className = 'era-header';
  const weekLabel = eraData.week ? `<div class="era-week">Week ${eraData.week}</div>` : '';
  header.innerHTML = `
    <h2>${eraData.era}${eraData.ching ? `<span class="ching-ref">${eraData.ching}</span>` : ``}</h2>
    <div class="era-dates">${eraData.eraRange}</div>
    ${weekLabel}
  `;
  section.appendChild(header);

  eraData.entries.forEach((entry, i) => {
    const side = i % 2 === 0 ? 'left' : 'right';
    const card = document.createElement('div');
    card.className = `entry ${side}`;
    card.dataset.era = eraData.era;
    card.dataset.search = `${entry.title} ${entry.location} ${entry.summary} ${entry.tags.join(' ')} ${entry.date}`.toLowerCase();

    const diagramBlock = buildDiagramBlock(entry);

    card.innerHTML = `
      <div class="entry-date">${entry.date}</div>
      <div class="entry-title">${entry.title}</div>
      <div class="entry-location">${entry.location}</div>
      <div class="entry-img-wrap"><img class="entry-img" alt="${entry.title}" loading="lazy" /></div>
      <div class="entry-summary">${entry.summary}</div>
      ${diagramBlock}
      <div class="entry-tags">${entry.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
      <div class="expand-hint"></div>
    `;

    // One image per entry (Option A)
    const imgEl = card.querySelector('.entry-img');
    if (imgEl) loadWikiThumb(imgEl, entry);

    card.addEventListener('click', () => {
      card.classList.toggle('expanded');
    });

    // Diagram toggle (do not collapse the card)
    const toggleBtn = card.querySelector('.plan-toggle');
    const panel = card.querySelector('.plan-panel');
    if (toggleBtn && panel) {
      toggleBtn.addEventListener('click', (ev) => {
        ev.stopPropagation();
        panel.classList.toggle('open');
        toggleBtn.textContent = panel.classList.contains('open') ? 'Hide Spatial Diagram' : 'Show Spatial Diagram';
      });
    }

    section.appendChild(card);
    allEntries.push(card);
  });

  timeline.appendChild(section);
});

// Filter
function filterEntries() {
  const query = searchInput.value.toLowerCase().trim();
  let visible = 0;

  allEntries.forEach(card => {
    const matchEra = !activeEra || card.dataset.era === activeEra;
    const matchSearch = !query || card.dataset.search.includes(query);
    if (matchEra && matchSearch) {
      card.classList.remove('hidden');
      visible++;
    } else {
      card.classList.add('hidden');
    }
  });

  // Show/hide era sections
  document.querySelectorAll('.era-section').forEach(sec => {
    const hasVisible = sec.querySelectorAll('.entry:not(.hidden)').length > 0;
    sec.classList.toggle('hidden', !hasVisible);
  });

  entryCount.textContent = `${visible} of ${allEntries.length} entries`;
}

searchInput.addEventListener('input', filterEntries);
filterEntries();

// Scroll animation
const observer = new IntersectionObserver((entries) => {
  entries.forEach(e => {
    if (e.isIntersecting) e.target.classList.add('visible');
  });
}, { threshold: 0.1 });

allEntries.forEach(card => observer.observe(card));
</script>
