<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARCH 250  -  Architecture History Timeline</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap');

  :root {
    --bg: #0a0a0f;
    --surface: #14141f;
    --surface2: #1e1e2e;
    --border: #2a2a3a;
    --text: #e8e6e3;
    --text-muted: #8a8a9a;
    --accent: #c9a84c;
    --accent-dim: #7a6530;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow-x: hidden;
  }

  /* HEADER */
  header {
    text-align: center;
    padding: 60px 20px 30px;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, #12121a 0%, var(--bg) 100%);
  }
  header h1 {
    font-family: 'Playfair Display', serif;
    font-size: 2.4rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: var(--accent);
  }
  header p {
    font-size: 0.95rem;
    color: var(--text-muted);
    margin-top: 8px;
    font-weight: 300;
  }

  /* ERA NAV */
  #era-nav {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 6px;
    padding: 18px 20px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .era-btn {
    padding: 6px 14px;
    border: 1px solid var(--border);
    border-radius: 20px;
    background: transparent;
    color: var(--text-muted);
    font-size: 0.78rem;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
    transition: all 0.25s;
    white-space: nowrap;
  }
  .era-btn:hover, .era-btn.active {
    background: var(--accent);
    color: #0a0a0f;
    border-color: var(--accent);
    font-weight: 500;
  }

  /* FILTER BAR */
  #filter-bar {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
    padding: 14px 20px;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
  }
  #search-input {
    padding: 8px 16px;
    width: 320px;
    max-width: 60vw;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface);
    color: var(--text);
    font-size: 0.85rem;
    font-family: 'Inter', sans-serif;
    outline: none;
    transition: border-color 0.2s;
  }
  #search-input:focus { border-color: var(--accent); }
  #search-input::placeholder { color: var(--text-muted); }

  #entry-count {
    font-size: 0.78rem;
    color: var(--text-muted);
  }

  /* TIMELINE CONTAINER */
  #timeline {
    max-width: 960px;
    margin: 0 auto;
    padding: 40px 20px 80px;
    position: relative;
  }

  /* Central spine */
  #timeline::before {
    content: '';
    position: absolute;
    left: 50%;
    top: 0;
    bottom: 0;
    width: 2px;
    background: var(--border);
    transform: translateX(-50%);
  }

  /* ERA SECTION */
  .era-section {
    margin-bottom: 60px;
  }
  .era-header {
    text-align: center;
    position: relative;
    z-index: 2;
    margin-bottom: 30px;
  }
  .era-header h2 {
    font-family: 'Playfair Display', serif;
    font-size: 1.5rem;
    color: var(--accent);
    display: inline-block;
    background: var(--bg);
    padding: 8px 24px;
    border: 1px solid var(--accent-dim);
    border-radius: 4px;
  }
  .era-header .era-dates {
    font-size: 0.8rem;
    color: var(--text-muted);
    margin-top: 6px;
    font-weight: 300;
  }
  .era-header .era-week {
    font-size: 0.7rem;
    color: var(--accent);
    margin-top: 4px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  /* ENTRY CARD */
  .entry {
    position: relative;
    width: 44%;
    padding: 18px 22px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 24px;
    cursor: pointer;
    transition: all 0.3s;
  }
  .entry:hover {
    border-color: var(--accent-dim);
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }
  .entry.left { margin-left: 0; margin-right: auto; }
  .entry.right { margin-left: auto; margin-right: 0; }

  /* Connector dot */
  .entry::after {
    content: '';
    position: absolute;
    top: 24px;
    width: 10px;
    height: 10px;
    background: var(--accent);
    border-radius: 50%;
    border: 2px solid var(--bg);
  }
  .entry.left::after { right: -32px; }
  .entry.right::after { left: -32px; }

  /* Connector line */
  .entry::before {
    content: '';
    position: absolute;
    top: 28px;
    width: 24px;
    height: 1px;
    background: var(--border);
  }
  .entry.left::before { right: -24px; }
  .entry.right::before { left: -24px; }

  .entry-date {
    font-size: 0.72rem;
    color: var(--accent);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 6px;
  }
  .entry-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.05rem;
    font-weight: 600;
    margin-bottom: 4px;
    line-height: 1.3;
  }
  .entry-location {
    font-size: 0.75rem;
    color: var(--text-muted);
    margin-bottom: 8px;
    font-style: italic;
  }

  /* ENTRY IMAGE */
  .entry-img-wrap {
    margin: 10px 0 6px;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid var(--border);
    background: #0f0f18;
    display: none;
  }
  .entry-img {
    display: block;
    width: 100%;
    height: auto;
  }
  .entry.has-img .entry-img-wrap { display: block; }
  .entry-summary {
    font-size: 0.82rem;
    color: var(--text-muted);
    line-height: 1.55;
    display: none;
  }
  .entry.expanded .entry-summary { display: block; }
  .entry-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-top: 10px;
  }
  .tag {
    font-size: 0.65rem;
    padding: 2px 8px;
    border-radius: 10px;
    background: var(--surface2);
    color: var(--text-muted);
    border: 1px solid var(--border);
  }

  .expand-hint {
    font-size: 0.7rem;
    color: var(--accent-dim);
    margin-top: 8px;
    transition: color 0.2s;
  }
  .entry:hover .expand-hint { color: var(--accent); }
  .entry.expanded .expand-hint::after { content: 'click to collapse'; }
  .entry:not(.expanded) .expand-hint::after { content: 'click to expand'; }

  /* KEY CONCEPTS PANEL */
  .concepts-panel {
    max-width: 960px;
    margin: 0 auto 40px;
    padding: 0 20px;
    display: none;
  }
  .concepts-panel.visible { display: block; }
  .concepts-panel h3 {
    font-family: 'Playfair Display', serif;
    font-size: 1.1rem;
    color: var(--accent);
    margin-bottom: 14px;
    text-align: center;
  }
  .concepts-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 10px;
  }
  .concept-card {
    padding: 12px 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  .concept-card strong {
    font-size: 0.82rem;
    color: var(--text);
    display: block;
    margin-bottom: 4px;
  }
  .concept-card span {
    font-size: 0.75rem;
    color: var(--text-muted);
    line-height: 1.4;
  }

  /* RESPONSIVE */
  @media (max-width: 700px) {
    #timeline::before { left: 20px; }
    .entry { width: calc(100% - 50px); margin-left: 50px !important; margin-right: 0 !important; }
    .entry::after { left: -38px !important; right: auto !important; }
    .entry::before { left: -30px !important; right: auto !important; }
    .era-btn { font-size: 0.7rem; padding: 5px 10px; }
    header h1 { font-size: 1.6rem; }
  }

  /* SCROLL ANIMATION */
  .entry { opacity: 0; transform: translateY(20px); transition: opacity 0.5s, transform 0.5s, border-color 0.3s, box-shadow 0.3s; }
  .entry.visible { opacity: 1; transform: translateY(0); }
  .entry:hover.visible { transform: translateY(-2px); }

  /* HIDDEN */
  .hidden { display: none !important; }
</style>
</head>

// -------------------------------------------------------------
// Image loading (Wikipedia JSONP)
// Works when the file is opened locally (file://) because it does
// not use fetch/XHR.
// -------------------------------------------------------------

// Some timeline labels are not ideal Wikipedia page titles.
// Add fixes here as needed.
const WIKI_TITLE_OVERRIDES = {
  "White Temple & Ziggurat at Uruk": "White Temple (Uruk)",
  "Megalithic Temples of Malta": "Megalithic Temples of Malta",
  "Hagia Sophia": "Hagia Sophia",
  "Old St. Peter’s Basilica": "Old St. Peter's Basilica",
};

function getWikiTitle(entry) {
  return entry.wiki || WIKI_TITLE_OVERRIDES[entry.title] || entry.title;
}

function loadWikiThumb(imgEl, entry) {
  const title = getWikiTitle(entry);
  const wrap = imgEl.closest('.entry');
  const cbName = `wiki_cb_${Math.random().toString(36).slice(2)}`;
  const script = document.createElement('script');

  window[cbName] = (data) => {
    try {
      const pages = data && data.query && data.query.pages ? data.query.pages : null;
      const firstKey = pages ? Object.keys(pages)[0] : null;
      const page = firstKey ? pages[firstKey] : null;
      const thumb = page && page.thumbnail && page.thumbnail.source ? page.thumbnail.source : null;

      if (thumb) {
        imgEl.src = thumb;
        wrap.classList.add('has-img');
      }
    } catch (e) {
      // no-op
    } finally {
      delete window[cbName];
      script.remove();
    }
  };

  script.onerror = () => {
    delete window[cbName];
    script.remove();
  };

  const api = 'https://en.wikipedia.org/w/api.php';
  const params = new URLSearchParams({
    action: 'query',
    format: 'json',
    prop: 'pageimages',
    piprop: 'thumbnail',
    pithumbsize: '700',
    redirects: '1',
    titles: title,
    callback: cbName,
  });

  script.src = `${api}?${params.toString()}`;
  document.head.appendChild(script);
}

// =============================================
// RENDER ENGINE
// =============================================
const timeline = document.getElementById('timeline');
const eraNav = document.getElementById('era-nav');
const searchInput = document.getElementById('search-input');
const entryCount = document.getElementById('entry-count');

let allEntries = [];
let activeEra = null;

// Build nav and timeline
DATA.forEach((eraData, eraIdx) => {
  // Nav button
  const btn = document.createElement('button');
  btn.className = 'era-btn';
  btn.textContent = eraData.era;
  btn.dataset.era = eraData.era;
  btn.addEventListener('click', () => {
    if (activeEra === eraData.era) {
      activeEra = null;
      btn.classList.remove('active');
    } else {
      activeEra = eraData.era;
      document.querySelectorAll('.era-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }
    filterEntries();
    // Scroll to era
    if (activeEra) {
      const section = document.querySelector(`[data-era-section="${eraData.era}"]`);
      if (section) section.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  });
  eraNav.appendChild(btn);

  // Era section
  const section = document.createElement('div');
  section.className = 'era-section';
  section.dataset.eraSection = eraData.era;

  const header = document.createElement('div');
  header.className = 'era-header';
  const weekLabel = eraData.week ? `<div class="era-week">Week ${eraData.week}</div>` : '';
  header.innerHTML = `<h2>${eraData.era}</h2><div class="era-dates">${eraData.eraRange}</div>${weekLabel}`;
  section.appendChild(header);

  eraData.entries.forEach((entry, i) => {
    const side = i % 2 === 0 ? 'left' : 'right';
    const card = document.createElement('div');
    card.className = `entry ${side}`;
    card.dataset.era = eraData.era;
    card.dataset.search = `${entry.title} ${entry.location} ${entry.summary} ${entry.tags.join(' ')} ${entry.date}`.toLowerCase();

    card.innerHTML = `
      <div class="entry-date">${entry.date}</div>
      <div class="entry-title">${entry.title}</div>
      <div class="entry-location">${entry.location}</div>
      <div class="entry-img-wrap"><img class="entry-img" alt="${entry.title}" loading="lazy" /></div>
      <div class="entry-summary">${entry.summary}</div>
      <div class="entry-tags">${entry.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
      <div class="expand-hint"></div>
    `;

    // One image per entry (Option A)
    const imgEl = card.querySelector('.entry-img');
    if (imgEl) loadWikiThumb(imgEl, entry);

    card.addEventListener('click', () => {
      card.classList.toggle('expanded');
    });

    section.appendChild(card);
    allEntries.push(card);
  });

  timeline.appendChild(section);
});

// Filter
function filterEntries() {
  const query = searchInput.value.toLowerCase().trim();
  let visible = 0;

  allEntries.forEach(card => {
    const matchEra = !activeEra || card.dataset.era === activeEra;
    const matchSearch = !query || card.dataset.search.includes(query);
    if (matchEra && matchSearch) {
      card.classList.remove('hidden');
      visible++;
    } else {
      card.classList.add('hidden');
    }
  });

  // Show/hide era sections
  document.querySelectorAll('.era-section').forEach(sec => {
    const hasVisible = sec.querySelectorAll('.entry:not(.hidden)').length > 0;
    sec.classList.toggle('hidden', !hasVisible);
  });

  entryCount.textContent = `${visible} of ${allEntries.length} entries`;
}

searchInput.addEventListener('input', filterEntries);
filterEntries();

// Scroll animation
const observer = new IntersectionObserver((entries) => {
  entries.forEach(e => {
    if (e.isIntersecting) e.target.classList.add('visible');
  });
}, { threshold: 0.1 });

allEntries.forEach(card => observer.observe(card));
</script>
