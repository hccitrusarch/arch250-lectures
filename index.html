<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARCH 250 - History of Architecture I</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap');

  :root {
    --bg: #0a0a0f;
    --surface: #14141f;
    --surface2: #1e1e2e;
    --border: #2a2a3a;
    --text: #e8e6e3;
    --text-muted: #8a8a9a;
    --accent: #c9a84c;
    --accent-dim: #7a6530;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow-x: hidden;
  }

  /* HEADER */
  header {
    text-align: center;
    padding: 60px 20px 30px;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, #12121a 0%, var(--bg) 100%);
  }
  header h1 {
    font-family: 'Playfair Display', serif;
    font-size: 2.4rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: var(--accent);
  }
  header p {
    font-size: 0.95rem;
    color: var(--text-muted);
    margin-top: 8px;
    font-weight: 300;
  }

  /* ERA NAV */
  #era-nav {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 6px;
    padding: 18px 20px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .era-btn {
    padding: 6px 14px;
    border: 1px solid var(--border);
    border-radius: 20px;
    background: transparent;
    color: var(--text-muted);
    font-size: 0.78rem;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
    transition: all 0.25s;
    white-space: nowrap;
  }
  .era-btn:hover, .era-btn.active {
    background: var(--accent);
    color: #0a0a0f;
    border-color: var(--accent);
    font-weight: 500;
  }

  /* FILTER BAR */
  #filter-bar {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
    padding: 14px 20px;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
  }
  #search-input {
    padding: 8px 16px;
    width: 320px;
    max-width: 60vw;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface);
    color: var(--text);
    font-size: 0.85rem;
    font-family: 'Inter', sans-serif;
    outline: none;
    transition: border-color 0.2s;
  }
  #search-input:focus { border-color: var(--accent); }
  #search-input::placeholder { color: var(--text-muted); }

  #entry-count {
    font-size: 0.78rem;
    color: var(--text-muted);
  }

  /* TIMELINE CONTAINER */
  #timeline {
    max-width: 960px;
    margin: 0 auto;
    padding: 40px 20px 80px;
    position: relative;
  }

  /* Central spine */
  #timeline::before {
    content: '';
    position: absolute;
    left: 50%;
    top: 0;
    bottom: 0;
    width: 2px;
    background: var(--border);
    transform: translateX(-50%);
  }

  /* ERA SECTION */
  .era-section {
    margin-bottom: 60px;
  }
  .era-header {
    text-align: center;
    position: relative;
    z-index: 2;
    margin-bottom: 30px;
  }
  .era-header h2 {
    font-family: 'Playfair Display', serif;
    font-size: 1.5rem;
    color: var(--accent);
    display: inline-block;
    background: var(--bg);
    padding: 8px 24px;
    border: 1px solid var(--accent-dim);
    border-radius: 4px;
    position: relative;
  }
  .ching-ref {
    display: inline-block;
    margin-left: 12px;
    padding: 4px 10px;
    background: var(--accent);
    color: var(--bg);
    font-size: 0.7rem;
    font-weight: 600;
    border-radius: 3px;
    font-family: 'Inter', sans-serif;
    letter-spacing: 0.02em;
  }
  .era-header .era-dates {
    font-size: 0.8rem;
    color: var(--text-muted);
    margin-top: 6px;
    font-weight: 300;
  }
  .era-header .era-week {
    font-size: 0.7rem;
    color: var(--accent);
    margin-top: 4px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  /* ENTRY CARD */
  .entry {
    position: relative;
    width: 44%;
    padding: 18px 22px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 24px;
    cursor: pointer;
    transition: all 0.3s;
  }
  .entry:hover {
    border-color: var(--accent-dim);
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }
  .entry.left { margin-left: 0; margin-right: auto; }
  .entry.right { margin-left: auto; margin-right: 0; }

  /* Connector dot */
  .entry::after {
    content: '';
    position: absolute;
    top: 24px;
    width: 10px;
    height: 10px;
    background: var(--accent);
    border-radius: 50%;
    border: 2px solid var(--bg);
  }
  .entry.left::after { right: -32px; }
  .entry.right::after { left: -32px; }

  /* Connector line */
  .entry::before {
    content: '';
    position: absolute;
    top: 28px;
    width: 24px;
    height: 1px;
    background: var(--border);
  }
  .entry.left::before { right: -24px; }
  .entry.right::before { left: -24px; }

  .entry-date {
    font-size: 0.72rem;
    color: var(--accent);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 6px;
  }
  .entry-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.05rem;
    font-weight: 600;
    margin-bottom: 4px;
    line-height: 1.3;
  }
  .entry-location {
    font-size: 0.75rem;
    color: var(--text-muted);
    margin-bottom: 8px;
    font-style: italic;
  }

  /* ENTRY IMAGE */
  .entry-img-wrap {
    margin: 10px 0 6px;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid var(--border);
    background: #0f0f18;
    display: none;
  }
  .entry-img {
    display: block;
    width: 100%;
    height: auto;
  }
  .entry.has-img .entry-img-wrap { display: block; }
  .entry-summary {
    font-size: 0.82rem;
    color: var(--text-muted);
    line-height: 1.55;
    display: none;
  }
  .entry.expanded .entry-summary { display: block; }

  /* SPATIAL DIAGRAMS (B2) */
  .plan-wrap {
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px solid var(--border);
  }
  .plan-topline {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 8px;
  }
  .plan-label {
    font-size: 0.7rem;
    color: var(--text-muted);
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .plan-toggle {
    appearance: none;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 0.74rem;
    cursor: pointer;
    transition: border-color 0.2s, transform 0.05s;
    white-space: nowrap;
  }
  .plan-toggle:hover { border-color: var(--accent-dim); }
  .plan-toggle:active { transform: translateY(1px); }
  .plan-panel { display: none; }
  .plan-panel.open { display: block; }
  .plan-svg {
    width: 100%;
    max-width: 280px;
    height: auto;
    display: block;
    margin-top: 6px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #0f0f18;
  }
  .plan-logic {
    margin-top: 10px;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface);
  }
  .plan-logic strong {
    color: var(--accent);
    font-size: 0.8rem;
  }
  .plan-logic p {
    margin-top: 6px;
    font-size: 0.8rem;
    color: var(--text-muted);
    line-height: 1.5;
  }

  .entry-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-top: 10px;
  }
  .tag {
    font-size: 0.65rem;
    padding: 2px 8px;
    border-radius: 10px;
    background: var(--surface2);
    color: var(--text-muted);
    border: 1px solid var(--border);
  }

  .expand-hint {
    font-size: 0.7rem;
    color: var(--accent-dim);
    margin-top: 8px;
    transition: color 0.2s;
  }
  .entry:hover .expand-hint { color: var(--accent); }
  .entry.expanded .expand-hint::after { content: 'click to collapse'; }
  .entry:not(.expanded) .expand-hint::after { content: 'click to expand'; }

  /* ERA STUDY PANEL */
  .era-study {
    max-width: 960px;
    margin: 30px auto;
    padding: 0 20px;
  }
  .era-study-toggle {
    display: block;
    width: 100%;
    padding: 14px 18px;
    background: var(--surface);
    border: 2px solid var(--accent-dim);
    border-radius: 8px;
    color: var(--accent);
    font-family: 'Inter', sans-serif;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s;
    text-align: left;
  }
  .era-study-toggle:hover {
    border-color: var(--accent);
    background: var(--surface2);
  }
  .era-study-content {
    display: none;
    margin-top: 12px;
    padding: 18px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  .era-study-content.open { display: block; }

  .concepts-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 12px;
    margin-bottom: 16px;
  }
  .concept-card {
    padding: 12px 14px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
  }
  .concept-card strong {
    font-size: 0.8rem;
    color: var(--accent);
    display: block;
    margin-bottom: 4px;
    font-weight: 600;
  }
  .concept-card span {
    font-size: 0.75rem;
    color: var(--text-muted);
    line-height: 1.4;
    display: block;
  }

  .architects-section {
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
  }
  .architects-section strong {
    font-size: 0.8rem;
    color: var(--accent);
    display: block;
    margin-bottom: 6px;
  }
  .architects-section p {
    font-size: 0.8rem;
    color: var(--text-muted);
    line-height: 1.5;
  }

  /* RESPONSIVE */
  @media (max-width: 700px) {
    #timeline::before { left: 20px; }
    .entry { width: calc(100% - 50px); margin-left: 50px !important; margin-right: 0 !important; }
    .entry::after { left: -38px !important; right: auto !important; }
    .entry::before { left: -30px !important; right: auto !important; }
    .era-btn { font-size: 0.7rem; padding: 5px 10px; }
    header h1 { font-size: 1.6rem; }
    .concepts-grid { grid-template-columns: 1fr; }
  }

  /* SCROLL ANIMATION */
  .entry { opacity: 0; transform: translateY(20px); transition: opacity 0.5s, transform 0.5s, border-color 0.3s, box-shadow 0.3s; }
  .entry.visible { opacity: 1; transform: translateY(0); }
  .entry:hover.visible { transform: translateY(-2px); }

  /* HIDDEN */
  .hidden { display: none !important; }
</style>
</head>

const ERAS = DATA.map(e => e.era);

let visibleEntries = [...DATA];

// =============================================
// Wikipedia JSONP image loading (works on local file://)
// Uses script-tag injection — no fetch/XHR CORS issues.
// Strategy: 1) direct title lookup, 2) search fallback
// =============================================
const WIKI_TITLE_OVERRIDES = {
  "White Temple & Ziggurat at Uruk": "White Temple (Uruk)",
  "Megalithic Temples of Malta": "Megalithic Temples of Malta",
  "Hagia Sophia": "Hagia Sophia",
  "Old St. Peter's Basilica": "Old St. Peter's Basilica",
  "Great Ziggurat of Ur": "Great Ziggurat of Ur",
  "Pyramid of Djoser": "Pyramid of Djoser",
  "Great Pyramid of Giza": "Great Pyramid of Giza",
  "Karnak Temple Complex": "Karnak",
  "Palace of Knossos": "Palace of Knossos",
  "Parthenon": "Parthenon",
  "Theater at Epidaurus": "Theatre of Epidaurus",
  "Pantheon, Rome": "Pantheon, Rome",
  "Hagia Sophia (532–537 CE)": "Hagia Sophia",
  "Chartres Cathedral": "Chartres Cathedral",
  "Florence Cathedral (Duomo)": "Florence Cathedral",
  "Tempietto di San Pietro in Montorio": "Tempietto",
  "Tempietto (Bramante)": "Tempietto",
  "Palazzo Te": "Palazzo Te",
  "Laurentian Library": "Laurentian Library",
  "Piazza del Campo": "Piazza del Campo",
};

function normalizeWikiTitle(str) {
  return (str || "")
    .replace(/[""]/g, '"')
    .replace(/['']/g, "'")
    .replace(/\s+/g, " ")
    .trim();
}

function getWikiTitle(entry) {
  return normalizeWikiTitle(entry.wiki || WIKI_TITLE_OVERRIDES[entry.title] || entry.title);
}

function jsonp(url, cbName, onDone) {
  const script = document.createElement('script');
  window[cbName] = (data) => {
    try { onDone(data); }
    finally {
      try { delete window[cbName]; } catch (e) {}
      script.remove();
    }
  };
  script.onerror = () => {
    try { delete window[cbName]; } catch (e) {}
    script.remove();
    onDone(null);
  };
  script.src = url;
  document.head.appendChild(script);
}

function wikiThumbByTitle(title, done) {
  const cbName = `wiki_title_${Math.random().toString(36).slice(2)}`;
  const api = 'https://en.wikipedia.org/w/api.php';
  const params = new URLSearchParams({
    action: 'query', format: 'json', prop: 'pageimages',
    piprop: 'thumbnail', pithumbsize: '700', redirects: '1',
    titles: title, callback: cbName,
  });
  jsonp(`${api}?${params.toString()}`, cbName, (data) => {
    try {
      const pages = data && data.query && data.query.pages ? data.query.pages : null;
      const firstKey = pages ? Object.keys(pages)[0] : null;
      const page = firstKey ? pages[firstKey] : null;
      const thumb = page && page.thumbnail && page.thumbnail.source ? page.thumbnail.source : null;
      done(thumb || null);
    } catch (e) { done(null); }
  });
}

function wikiThumbBySearch(term, done) {
  const cbName = `wiki_search_${Math.random().toString(36).slice(2)}`;
  const api = 'https://en.wikipedia.org/w/api.php';
  const params = new URLSearchParams({
    action: 'query', format: 'json', generator: 'search',
    gsrsearch: term, gsrlimit: '1', prop: 'pageimages',
    piprop: 'thumbnail', pithumbsize: '700', redirects: '1',
    callback: cbName,
  });
  jsonp(`${api}?${params.toString()}`, cbName, (data) => {
    try {
      const pages = data && data.query && data.query.pages ? data.query.pages : null;
      const key = pages ? Object.keys(pages)[0] : null;
      const page = key ? pages[key] : null;
      const thumb = page && page.thumbnail && page.thumbnail.source ? page.thumbnail.source : null;
      done(thumb || null);
    } catch (e) { done(null); }
  });
}

function loadWikiThumb(imgEl, entry) {
  const wrap = imgEl.closest('.entry');
  const title = getWikiTitle(entry);
  wikiThumbByTitle(title, (thumb1) => {
    if (thumb1) {
      imgEl.src = thumb1;
      if (wrap) wrap.classList.add('has-img');
      return;
    }
    const searchTerm = normalizeWikiTitle(`${title} ${entry.location || ''}`.trim());
    wikiThumbBySearch(searchTerm, (thumb2) => {
      if (thumb2) {
        imgEl.src = thumb2;
        if (wrap) wrap.classList.add('has-img');
      }
    });
  });
}

function initEraNav() {
  const nav = document.getElementById('era-nav');
  ERAS.forEach(era => {
    const btn = document.createElement('button');
    btn.className = 'era-btn';
    btn.textContent = era;
    btn.onclick = () => filterByEra(era, btn);
    nav.appendChild(btn);
  });
}

function filterByEra(era, btn) {
  document.querySelectorAll('.era-btn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  
  if (era === 'ALL') {
    visibleEntries = [...DATA];
  } else {
    visibleEntries = DATA.filter(e => e.era === era);
  }
  
  renderTimeline();
  updateEntryCount();
}

function searchEntries(query) {
  const q = query.toLowerCase();
  visibleEntries = DATA.filter(e => 
    JSON.stringify(e).toLowerCase().includes(q)
  );
  renderTimeline();
  updateEntryCount();
}

function renderTimeline() {
  const timeline = document.getElementById('timeline');
  timeline.innerHTML = '';
  
  let isLeft = true;
  
  visibleEntries.forEach(eraData => {
    // Era section header
    const eraSection = document.createElement('div');
    eraSection.className = 'era-section';
    
    const eraHeader = document.createElement('div');
    eraHeader.className = 'era-header';
    
    const h2 = document.createElement('h2');
    h2.textContent = eraData.era;
    
    if (eraData.ching) {
      const chingBadge = document.createElement('span');
      chingBadge.className = 'ching-ref';
      chingBadge.textContent = eraData.ching;
      h2.appendChild(chingBadge);
    }
    
    eraHeader.appendChild(h2);
    
    const datesDiv = document.createElement('div');
    datesDiv.className = 'era-dates';
    datesDiv.textContent = eraData.eraRange;
    eraHeader.appendChild(datesDiv);
    
    if (eraData.week) {
      const weekDiv = document.createElement('div');
      weekDiv.className = 'era-week';
      weekDiv.textContent = `Week ${eraData.week}`;
      eraHeader.appendChild(weekDiv);
    }
    
    eraSection.appendChild(eraHeader);
    
    // Key concepts panel
    if (eraData.concepts && eraData.concepts.length > 0) {
      const eraStudy = document.createElement('div');
      eraStudy.className = 'era-study';
      
      const toggleBtn = document.createElement('button');
      toggleBtn.className = 'era-study-toggle';
      toggleBtn.textContent = '📚 Key Concepts & Architects';
      
      const content = document.createElement('div');
      content.className = 'era-study-content';
      
      const conceptsGrid = document.createElement('div');
      conceptsGrid.className = 'concepts-grid';
      
      eraData.concepts.forEach(concept => {
        const card = document.createElement('div');
        card.className = 'concept-card';
        card.innerHTML = `<strong>${concept.term}</strong><span>${concept.def}</span>`;
        conceptsGrid.appendChild(card);
      });
      
      content.appendChild(conceptsGrid);
      
      if (eraData.keyArchitects) {
        const archSection = document.createElement('div');
        archSection.className = 'architects-section';
        archSection.innerHTML = `<strong>Key Architects/Builders:</strong><p>${eraData.keyArchitects}</p>`;
        content.appendChild(archSection);
      }
      
      toggleBtn.onclick = () => content.classList.toggle('open');
      
      eraStudy.appendChild(toggleBtn);
      eraStudy.appendChild(content);
      eraSection.appendChild(eraStudy);
    }
    
    // Entries
    eraData.entries.forEach(entry => {
      const card = document.createElement('div');
      card.className = `entry ${isLeft ? 'left' : 'right'} hidden`;
      card.dataset.era = eraData.era;
      
      const dateDiv = document.createElement('div');
      dateDiv.className = 'entry-date';
      dateDiv.textContent = entry.date;
      card.appendChild(dateDiv);
      
      const titleDiv = document.createElement('div');
      titleDiv.className = 'entry-title';
      titleDiv.textContent = entry.title;
      card.appendChild(titleDiv);
      
      const locDiv = document.createElement('div');
      locDiv.className = 'entry-location';
      locDiv.textContent = entry.location;
      card.appendChild(locDiv);
      
      const imgWrap = document.createElement('div');
      imgWrap.className = 'entry-img-wrap';
      const img = document.createElement('img');
      img.className = 'entry-img';
      img.alt = entry.title;
      img.loading = 'lazy';
      imgWrap.appendChild(img);
      card.appendChild(imgWrap);
      
      const sumDiv = document.createElement('div');
      sumDiv.className = 'entry-summary';
      sumDiv.textContent = entry.summary;
      card.appendChild(sumDiv);
      
      // Plan diagram
      const diag = DIAGRAMS[entry.title];
      if (diag) {
        const planWrap = document.createElement('div');
        planWrap.className = 'plan-wrap';
        
        const topline = document.createElement('div');
        topline.className = 'plan-topline';
        
        const label = document.createElement('span');
        label.className = 'plan-label';
        label.textContent = 'Site Plan';
        topline.appendChild(label);
        
        const btn = document.createElement('button');
        btn.className = 'plan-toggle';
        btn.textContent = 'Show Plan';
        
        const panel = document.createElement('div');
        panel.className = 'plan-panel';
        panel.innerHTML = diag;
        
        btn.onclick = () => panel.classList.toggle('open');
        
        topline.appendChild(btn);
        planWrap.appendChild(topline);
        planWrap.appendChild(panel);
        
        card.appendChild(planWrap);
      }
      
      if (entry.tags && entry.tags.length > 0) {
        const tagsDiv = document.createElement('div');
        tagsDiv.className = 'entry-tags';
        entry.tags.forEach(tag => {
          const tagSpan = document.createElement('span');
          tagSpan.className = 'tag';
          tagSpan.textContent = tag;
          tagsDiv.appendChild(tagSpan);
        });
        card.appendChild(tagsDiv);
      }
      
      const hintDiv = document.createElement('div');
      hintDiv.className = 'expand-hint';
      card.appendChild(hintDiv);
      
      card.onclick = () => {
        card.classList.toggle('expanded');
      };
      
      eraSection.appendChild(card);

      // Load Wikipedia thumbnail via JSONP (works on local file://)
      const imgEl = card.querySelector('.entry-img');
      if (imgEl) loadWikiThumb(imgEl, entry);

      isLeft = !isLeft;
    });
    
    timeline.appendChild(eraSection);
  });
  
  // Animate visible entries
  setTimeout(() => {
    document.querySelectorAll('.entry.hidden').forEach((el, idx) => {
      setTimeout(() => {
        el.classList.remove('hidden');
        el.classList.add('visible');
      }, idx * 50);
    });
  }, 100);
}

function updateEntryCount() {
  const count = document.querySelectorAll('.entry').length;
  document.getElementById('entry-count').textContent = `${count} entries`;
}

document.getElementById('search-input').addEventListener('keyup', (e) => {
  searchEntries(e.target.value);
});

initEraNav();
renderTimeline();
updateEntryCount();

</script>
